# Optional, explicitly installed DB-IP City Lite. No download occurs at startup.
# After installation, enable with COMPOSE_FILE=compose.yaml:compose.geo.yaml sh scripts/deploy.sh.
# Include compose.caddy.yaml in that list for Caddy; later helper runs retain the recorded file list.
# An explicit COMPOSE_FILE changes/disables overlays. Direct Compose commands must still include this file.
# See https://github.com/Ten98-IO-Company/ten98-discover/wiki/Deployment#geography-database.
services:
  web:
    memswap_limit: 1G
    environment:
      ANALYTICS_GEO_DB_FILE: /data/geography/city.mmdb
    volumes:
      - type: bind
        source: ./data/geography
        target: /data/geography
        read_only: true
        bind:
          create_host_path: false
    deploy:
      resources:
        limits:
          memory: 1G # optional profile; see the measured workload and limits in the setup guide
