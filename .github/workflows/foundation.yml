name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: ten98
          POSTGRES_DB: ten98_test
          # Only this fresh hosted-runner service uses trust, bound to loopback.
          # This is not a deployment configuration or a production auth example.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U ten98 -d ten98_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_URL: http://localhost:3000
      BASE_URL: http://127.0.0.1:3000
      DATABASE_URL: postgres://ten98@127.0.0.1:5432/ten98_test
      HOST: 127.0.0.1
      PORT: '3000'
      TEN98_INTEGRATION_TEST: '1'
      ANALYTICS_NETWORK_MODE: direct
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare isolated test configuration
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { randomBytes } from 'node:crypto';
          import { appendFileSync, mkdirSync } from 'node:fs';
          import { join } from 'node:path';
          for (const key of ['AUTH_SECRET', 'BOOTSTRAP_TOKEN']) {
            const value = randomBytes(32).toString('hex');
            console.log(`::add-mask::${value}`);
            appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          }
          const credentialKey = randomBytes(32).toString('base64');
          console.log(`::add-mask::${credentialKey}`);
          appendFileSync(process.env.GITHUB_ENV, `CREDENTIAL_KEYS=${JSON.stringify({v1: credentialKey})}\nCREDENTIAL_ACTIVE_KEY=v1\n`);
          const artifacts = join(process.env.RUNNER_TEMP, 'ten98-foundation-artifacts');
          mkdirSync(artifacts, { recursive: true, mode: 0o700 });
          appendFileSync(process.env.GITHUB_ENV, `ARTIFACT_DIR=${artifacts}\n`);
          NODE
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Build and check
        shell: bash
        run: |
          pnpm build
          pnpm typecheck
          pnpm test
          pnpm check:plan
      - name: Verify original-install upgrade, domain isolation and project content
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import pg from 'pg';
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL, connectionTimeoutMillis: 5000 });
          try {
            await client.connect();
            await client.query('CREATE DATABASE ten98_upgrade');
            await client.query('CREATE DATABASE ten98_domains');
            await client.query('CREATE DATABASE ten98_context');
            await client.query('CREATE DATABASE ten98_paid');
            await client.query('CREATE DATABASE ten98_prompt_insights_ci');
            await client.query('CREATE DATABASE ten98_prompt_insights_comparison_ci');
            await client.query('CREATE DATABASE ten98_citation_context_ci');
            await client.query('CREATE DATABASE ten98_prompt_citations_ci');
            await client.query('CREATE DATABASE ten98_site_api');
            await client.query('CREATE DATABASE ten98_site_retention');
            await client.query('CREATE DATABASE ten98_site_worker_ci');
            await client.query('CREATE DATABASE ten98_funnels_ci');
            await client.query('CREATE DATABASE ten98_saved_keywords_ci');
            await client.query('CREATE DATABASE ten98_provider_identity_legacy_ci');
            await client.query('CREATE DATABASE ten98_provider_identity_deferred_ci');
            await client.query('CREATE DATABASE ten98_provider_identity_rank_ci');
            await client.query('CREATE DATABASE ten98_provider_identity_upgrade22_ci');
            await client.query('CREATE DATABASE ten98_rank_schedule_ci');
            await client.query('CREATE DATABASE ten98_restore_quarantine_ci');
            await client.query('CREATE DATABASE ten98_rank_tracking_ci');
            await client.query('CREATE DATABASE ten98_rank_execution_ci');
            await client.query('CREATE DATABASE ten98_rank_worker_ci');
            await client.query('CREATE DATABASE ten98_rank_retention_ci');
            await client.query('CREATE DATABASE ten98_rank_reconciliation_ci');
            await client.query('CREATE DATABASE ten98_rank_history_ci');
            await client.query('CREATE DATABASE ten98_rank_scheduling_ci');
            await client.query('CREATE DATABASE ten98_rank_recurring_ci');
            await client.query('CREATE DATABASE ten98_rank_distribution_ci');
            await client.query('CREATE DATABASE ten98_rank_matrix_ci');
            await client.query('CREATE DATABASE ten98_meta_auth_ci');
            await client.query('CREATE DATABASE ten98_meta_callbacks_ci');
            await client.query('CREATE DATABASE ten98_meta_auth_reports_ci');
            await client.query('CREATE DATABASE ten98_meta_callbacks_imports_ci');
            await client.query('CREATE DATABASE ten98_meta_auth_imports_ci');
            await client.query('CREATE DATABASE ten98_meta_auth_worker_ci');
            await client.query('CREATE DATABASE ten98_meta_auth_latest_ci');
            await client.query('CREATE DATABASE ten98_meta_auth_inventory_ci');
            await client.query('CREATE DATABASE ten98_meta_auth_inventory_worker_ci');
            await client.query('CREATE DATABASE ten98_meta_auth_inventory_boundary_ci');
            await client.query('CREATE DATABASE ten98_meta_callbacks_inventory_ci');
          } catch {
            console.error('Could not prepare the isolated migration test database.');
            process.exitCode = 1;
          } finally { await client.end(); }
          if (!process.exitCode) {
            for (const [name, commands, testEnv = {}] of [
              ['ten98_upgrade', [['tests/migrations-integration.ts']]],
              ['ten98_domains', [['src/server/cli.ts', 'migrate'], ['tests/domains-integration.ts']]],
              ['ten98_context', [['src/server/cli.ts', 'migrate'], ['tests/project-context-integration.ts']]],
              ['ten98_paid', [['src/server/cli.ts', 'migrate'], ['tests/keyword-research-integration.ts'], ['tests/prompt-execution-integration.ts'], ['tests/google-retention-integration.ts']]],
              ['ten98_prompt_insights_ci', [['src/server/cli.ts', 'migrate'], ['tests/prompt-insights-integration.ts']], { TEN98_PROMPT_INSIGHTS_TEST: '1', TEN98_ISOLATED_CI_DATABASE: '1' }],
              ['ten98_prompt_insights_comparison_ci', [['src/server/cli.ts', 'migrate'], ['tests/prompt-insights-comparison-integration.ts']], { TEN98_PROMPT_INSIGHTS_COMPARISON_TEST: '1', TEN98_ISOLATED_CI_DATABASE: '1' }],
              ['ten98_citation_context_ci', [['src/server/cli.ts', 'migrate'], ['tests/citation-context-integration.ts']], { TEN98_CITATION_CONTEXT_TEST: '1', TEN98_ISOLATED_CI_DATABASE: '1' }],
              ['ten98_prompt_citations_ci', [['src/server/cli.ts', 'migrate'], ['tests/prompt-citations-integration.ts']], { TEN98_PROMPT_CITATIONS_TEST: '1', TEN98_ISOLATED_CI_DATABASE: '1' }],
              ['ten98_site_api', [['src/server/cli.ts', 'migrate'], ['tests/site-audits-integration.ts']]],
              ['ten98_site_retention', [['src/server/cli.ts', 'migrate'], ['tests/site-audit-retention-integration.ts']]],
              ['ten98_site_worker_ci', [['src/server/cli.ts', 'migrate'], ['tests/site-audit-worker-integration.ts']]],
              ['ten98_funnels_ci', [['src/server/cli.ts', 'migrate'], ['tests/funnels-integration.ts']]],
              ['ten98_saved_keywords_ci', [['src/server/cli.ts', 'migrate'], ['tests/saved-keywords-integration.ts']], { TEN98_ISOLATED_CI_DATABASE: '1' }],
              ['ten98_provider_identity_legacy_ci', [['tests/provider-account-identity-integration.ts']], { TEN98_IDENTITY_TEST_CASE: 'legacy', TEN98_ISOLATED_CI_DATABASE: '1' }],
              ['ten98_provider_identity_deferred_ci', [['tests/provider-account-identity-integration.ts']], { TEN98_IDENTITY_TEST_CASE: 'deferred', TEN98_ISOLATED_CI_DATABASE: '1' }],
              ['ten98_provider_identity_rank_ci', [['tests/provider-account-identity-integration.ts']], { TEN98_IDENTITY_TEST_CASE: 'rank', TEN98_ISOLATED_CI_DATABASE: '1' }],
              ['ten98_provider_identity_upgrade22_ci', [['tests/provider-account-identity-integration.ts']], { TEN98_IDENTITY_TEST_CASE: 'upgrade22', TEN98_ISOLATED_CI_DATABASE: '1' }],
              ['ten98_rank_schedule_ci', [['tests/rank-schedule-integration.ts'], ['tests/rank-schema-review.ts']], { TEN98_ISOLATED_CI_DATABASE: '1' }],
              ['ten98_restore_quarantine_ci', [['src/server/cli.ts', 'migrate'], ['tests/restore-quarantine-integration.ts']], { TEN98_RESTORE_TEST: '1', TEN98_ISOLATED_CI_DATABASE: '1' }],
              ['ten98_rank_tracking_ci', [['src/server/cli.ts', 'migrate'], ['tests/rank-tracking-integration.ts']], { TEN98_RANK_TRACKING_TEST: '1', TEN98_ISOLATED_CI_DATABASE: '1' }],
              ['ten98_rank_execution_ci', [['src/server/cli.ts', 'migrate'], ['tests/rank-execution-integration.ts']], { TEN98_RANK_EXECUTION_TEST: '1', TEN98_ISOLATED_CI_DATABASE: '1' }],
              ['ten98_rank_worker_ci', [['src/server/cli.ts', 'migrate'], ['tests/rank-worker-integration.ts']], { TEN98_RANK_WORKER_TEST: '1', TEN98_ISOLATED_CI_DATABASE: '1' }],
              ['ten98_rank_retention_ci', [['src/server/cli.ts', 'migrate'], ['tests/rank-retention-integration.ts']], { TEN98_RANK_RETENTION_TEST: '1', TEN98_ISOLATED_CI_DATABASE: '1' }],
              ['ten98_rank_reconciliation_ci', [['src/server/cli.ts', 'migrate'], ['tests/rank-reconciliation-integration.ts']], { TEN98_RANK_RECONCILIATION_TEST: '1', TEN98_ISOLATED_CI_DATABASE: '1' }],
              ['ten98_rank_history_ci', [['src/server/cli.ts', 'migrate'], ['tests/rank-history-integration.ts']], { TEN98_RANK_HISTORY_TEST: '1', TEN98_ISOLATED_CI_DATABASE: '1' }],
              ['ten98_rank_scheduling_ci', [['src/server/cli.ts', 'migrate'], ['tests/rank-scheduling-integration.ts']], { TEN98_RANK_SCHEDULING_TEST: '1', TEN98_ISOLATED_CI_DATABASE: '1' }],
              ['ten98_rank_recurring_ci', [['src/server/cli.ts', 'migrate'], ['tests/rank-recurring-integration.ts']], { TEN98_RANK_RECURRING_TEST: '1', TEN98_ISOLATED_CI_DATABASE: '1' }],
              ['ten98_rank_distribution_ci', [['src/server/cli.ts', 'migrate'], ['tests/rank-distribution-integration.ts']], { TEN98_RANK_DISTRIBUTION_TEST: '1', TEN98_ISOLATED_CI_DATABASE: '1' }],
              ['ten98_rank_matrix_ci', [['src/server/cli.ts', 'migrate'], ['tests/rank-matrix-integration.ts']], { TEN98_RANK_MATRIX_TEST: '1', TEN98_ISOLATED_CI_DATABASE: '1' }],
              ['ten98_meta_auth_ci', [['src/server/cli.ts', 'migrate'], ['tests/meta-auth-integration.ts']], { TEN98_META_AUTH_TEST: '1', TEN98_ISOLATED_CI_DATABASE: '1' }],
              ['ten98_meta_callbacks_ci', [['src/server/cli.ts', 'migrate'], ['tests/meta-callbacks-integration.ts']], { TEN98_ISOLATED_CI_DATABASE: '1' }],
              ['ten98_meta_auth_reports_ci', [['src/server/cli.ts', 'migrate'], ['tests/meta-report-auth-integration.ts']], { TEN98_META_AUTH_TEST: '1', TEN98_ISOLATED_CI_DATABASE: '1' }],
              ['ten98_meta_callbacks_imports_ci', [['src/server/cli.ts', 'migrate'], ['tests/meta-import-deletion-integration.ts']], { TEN98_ISOLATED_CI_DATABASE: '1' }],
              ['ten98_meta_auth_imports_ci', [['src/server/cli.ts', 'migrate'], ['tests/meta-import-integration.ts']], { TEN98_META_AUTH_TEST: '1', TEN98_ISOLATED_CI_DATABASE: '1' }],
              ['ten98_meta_auth_latest_ci', [['src/server/cli.ts', 'migrate'], ['tests/meta-latest-integration.ts']], { TEN98_META_AUTH_TEST: '1', TEN98_ISOLATED_CI_DATABASE: '1' }],
              ['ten98_meta_auth_worker_ci', [['src/server/cli.ts', 'migrate'], ['tests/meta-import-worker-integration.ts']], { TEN98_META_AUTH_TEST: '1', TEN98_ISOLATED_CI_DATABASE: '1' }],
              ['ten98_meta_auth_inventory_ci', [['src/server/cli.ts', 'migrate'], ['tests/meta-inventory-integration.ts']], { TEN98_META_AUTH_TEST: '1', TEN98_ISOLATED_CI_DATABASE: '1' }],
              ['ten98_meta_auth_inventory_worker_ci', [['src/server/cli.ts', 'migrate'], ['tests/meta-inventory-worker-integration.ts']], { TEN98_META_AUTH_TEST: '1', TEN98_ISOLATED_CI_DATABASE: '1' }],
              ['ten98_meta_auth_inventory_boundary_ci', [['src/server/cli.ts', 'migrate'], ['tests/meta-inventory-boundary-integration.ts']], { TEN98_META_AUTH_TEST: '1', TEN98_ISOLATED_CI_DATABASE: '1' }],
              ['ten98_meta_callbacks_inventory_ci', [['src/server/cli.ts', 'migrate'], ['tests/meta-inventory-deletion-integration.ts']], { TEN98_META_CALLBACKS_TEST: '1', TEN98_ISOLATED_CI_DATABASE: '1' }],
            ]) {
              const database = new URL(process.env.DATABASE_URL);
              database.pathname = `/${name}`;
              for (const args of commands) {
                const result = spawnSync(process.execPath, args, {
                  env: { ...process.env, ...testEnv, DATABASE_URL: database.href }, stdio: 'inherit', timeout: 120_000,
                });
                if (result.status !== 0) {
                  console.error('Isolated database checks did not complete successfully.');
                  process.exitCode = 1;
                  break;
                }
              }
              if (process.exitCode) break;
            }
          }
          NODE
      - name: Verify real web and worker integration
        shell: bash
        env:
          NODE_ENV: production
        run: |
          pnpm migrate
          web_pid=''
          worker_pid=''
          cleanup() {
            result=$?
            trap - EXIT INT TERM
            if [ -n "$web_pid" ]; then kill "$web_pid" 2>/dev/null || true; fi
            if [ -n "$worker_pid" ]; then kill "$worker_pid" 2>/dev/null || true; fi
            deadline=$((SECONDS + 35))
            while [ "$SECONDS" -lt "$deadline" ]; do
              running=false
              for pid in "$web_pid" "$worker_pid"; do
                if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then running=true; fi
              done
              if [ "$running" = false ]; then break; fi
              sleep 1
            done
            for pid in "$web_pid" "$worker_pid"; do
              if [ -n "$pid" ]; then kill -KILL "$pid" 2>/dev/null || true; fi
            done
            if [ -n "$web_pid" ]; then wait "$web_pid" 2>/dev/null || true; fi
            if [ -n "$worker_pid" ]; then wait "$worker_pid" 2>/dev/null || true; fi
            if [ "$result" -ne 0 ]; then
              for log in "$RUNNER_TEMP/ten98-web.log" "$RUNNER_TEMP/ten98-worker.log"; do
                if [ -f "$log" ]; then tail -n 80 "$log"; fi
              done
            fi
            exit "$result"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          node .output/server/index.mjs >"$RUNNER_TEMP/ten98-web.log" 2>&1 &
          web_pid=$!
          node src/server/cli.ts worker >"$RUNNER_TEMP/ten98-worker.log" 2>&1 &
          worker_pid=$!
          export WEB_PID="$web_pid" WORKER_PID="$worker_pid"
          if ! timeout 60s bash -c '
            until curl --fail --silent --max-time 2 "$BASE_URL/api/health/ready" >/dev/null \
              && timeout 5s node src/server/cli.ts diagnose worker >/dev/null 2>&1; do
              kill -0 "$WEB_PID" "$WORKER_PID" 2>/dev/null || exit 1
              sleep 1
            done
          '; then
            echo "Web and worker did not become ready within 60 seconds."
            exit 1
          fi
          node src/server/cli.ts diagnose worker
          pnpm test:integration
